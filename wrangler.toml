name = "ai-finance-tracker"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "~/.cargo/bin/worker-build --release"
watch_dir = "api"

[placement]
mode = "smart"

[observability]
enabled = true

[[routes]]
pattern = "finance.msdqn.dev/*"
zone_name = "msdqn.dev"

[[d1_databases]]
binding = "DB"
database_name = "ai-finance-tracker"
database_id = "d5ba95c3-20e8-4f8c-bbfe-b7bb337cd9a9"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "ai-finance-tracker-storage"

[vars]
ENVIRONMENT = "production"

[env.staging]
name = "ai-finance-tracker-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ai-finance-tracker-staging"
database_id = "replace-with-your-staging-d1-database-id"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "ai-finance-tracker-storage-staging"
