name = "ai-finance-tracker"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q worker-build && worker-build --release"
watch_dir = "src"

[placement]
mode = "smart"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ai-finance-tracker"
database_id = "replace-with-your-d1-database-id"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "ai-finance-tracker-storage"

[vars]
ENVIRONMENT = "production"

# Secrets — set via CLI, never in this file:
#   wrangler secret put JWT_SECRET
#   wrangler secret put DEEPSEEK_API_KEY

[env.staging]
name = "ai-finance-tracker-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ai-finance-tracker-staging"
database_id = "replace-with-your-staging-d1-database-id"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "ai-finance-tracker-storage-staging"
